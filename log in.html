<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>log in</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(to right, #ffe0ec, #dfe9f3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 300px;
      transition: transform 0.3s ease-in-out;
    }

    .login-box:hover {
      transform: scale(1.03);
    }

    h2 {
      margin-bottom: 20px;
      color: #ff69b4;
      font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 2px solid #ffb6c1;
      border-radius: 10px;
      outline: none;
    }

    button {
      background: #ff69b4;
      color: white;
      padding: 10px;
      border: none;
      width: 100%;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #ff1493;
    }

    .error {
      color: red;
      margin-top: 10px;
    }

    .emoji {
      font-size: 40px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="emoji"></div>
    <h2>pag log in duh lisod pud</h2>
    <form onsubmit="return login()">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <div id="error" class="error"></div>
    </form>
  </div>

  <script>
    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;


      if (username === "my love from the star" && password === "282904") {
    
        window.location.href = "don.html";
      } else {
        document.getElementById('error').textContent = "Oops! Wrong username or password.";
      }

      return false; 
    }
  </script>

</body>
</html>
